name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reading workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than only the implementation.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Permission, privacy, or API impact
      description: Note any new browser permission, persistent data, provider, or paid API behavior.

