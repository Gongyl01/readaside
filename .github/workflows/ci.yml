name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - name: Ensure committed bundle is current
        run: git diff --exit-code -- dist/
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: readaside-extension
          path: release/*.zip

